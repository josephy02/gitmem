<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="780" height="500" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="780" height="500" rx="10" fill="#0d1117"/>
    <rect width="780" height="36" fill="#161b22"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <text x="390" y="22" text-anchor="middle" fill="#8b949e" font-size="12">gitmem — memory your agents can git blame</text>

    <text x="24" y="66" fill="#7ee787">$</text>
    <text x="40" y="66" fill="#e6edf3">gitmem append --scope team/core --kind decision \</text>
    <text x="56" y="84" fill="#e6edf3">--body "Mobile still depends on the old auth module; do not refactor."</text>
    <text x="24" y="104" fill="#8b949e">01K2X9V7Q3JW5RN8T2M4C6D8F0</text>

    <text x="24" y="138" fill="#7ee787">$</text>
    <text x="40" y="138" fill="#e6edf3">gitmem brief</text>
    <text x="24" y="158" fill="#d2a8ff" font-weight="bold"># Memory Brief — team/core</text>
    <text x="24" y="178" fill="#79c0ff" font-weight="bold">## Decisions</text>
    <text x="24" y="198" fill="#e6edf3">- Mobile still depends on the old auth module; do not refactor. <tspan fill="#8b949e">(joseph, 2026-08-15)</tspan></text>
    <text x="24" y="218" fill="#79c0ff" font-weight="bold">## Facts</text>
    <text x="24" y="238" fill="#e6edf3">- The staging DB is reset every Saturday 03:00 UTC. <tspan fill="#8b949e">(builder-3, 2026-08-09)</tspan></text>

    <text x="24" y="272" fill="#7ee787">$</text>
    <text x="40" y="272" fill="#e6edf3">gitmem conflicts</text>
    <text x="24" y="292" fill="#f85149">222b63fc [negation]</text>
    <text x="24" y="312" fill="#e6edf3">  "spot instances are used for batch jobs only" <tspan fill="#8b949e">(builder-3)</tspan></text>
    <text x="24" y="332" fill="#e6edf3">  vs "spot instances are <tspan fill="#f85149">not</tspan> used for batch jobs only" <tspan fill="#8b949e">(builder-7)</tspan></text>

    <text x="24" y="366" fill="#7ee787">$</text>
    <text x="40" y="366" fill="#e6edf3">gitmem stale</text>
    <text x="24" y="386" fill="#febc2e">[stale?]</text>
    <text x="92" y="386" fill="#e6edf3">validateToken always returns true in dev mode</text>
    <text x="24" y="406" fill="#8b949e">  anchor: src/auth.ts#validateToken</text>
    <text x="24" y="426" fill="#8b949e">  changed by: e1faa27 flip validateToken default</text>

    <text x="24" y="460" fill="#7ee787">$</text>
    <text x="40" y="460" fill="#e6edf3">git blame log/2026/08/15.jsonl</text>
    <text x="24" y="480" fill="#8b949e">— because your agent's memory is just a git repo ✨</text>
  </g>
</svg>
